name: phase-b

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 3 1 *"
  push:
    branches: [main]
    paths:
      - config/phase-b.toml
      - src/thrive/data/phase_b.py
      - .github/workflows/phase-b.yml

permissions:
  contents: write

concurrency:
  group: phase-b
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[geo]"
      - name: Run Phase B
        id: phase
        run: |
          mkdir -p results/phase-b
          set +e
          timeout --signal=INT --kill-after=2m 80m thrive phase-b --config config/phase-b.toml --out results/phase-b > results/phase-b/last-run.log 2>&1
          code=$?
          set -e
          cat results/phase-b/last-run.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit results and the run log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase-b
          if git diff --cached --quiet; then
            echo "No change in results"
          else
            git commit -m "Phase B results"
            git pull --rebase
            git push
          fi
      - name: Fail if Phase B failed
        if: steps.phase.outputs.code != '0'
        run: exit 1
