name: phase-a

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 2 * *"
  push:
    branches: [main]
    paths:
      - config/phase-a.toml
      - src/thrive/data/**
      - .github/workflows/phase-a.yml

permissions:
  contents: write

concurrency:
  group: phase-a
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[data]"
      - name: Run Phase A
        id: phase
        run: |
          mkdir -p results/phase-a
          set +e
          thrive phase-a --config config/phase-a.toml --out results/phase-a > results/phase-a/last-run.log 2>&1
          code=$?
          set -e
          cat results/phase-a/last-run.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit results and the run log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase-a
          if git diff --cached --quiet; then
            echo "No change in results"
          else
            git commit -m "Phase A results"
            git pull --rebase
            git push
          fi
      - name: Fail if Phase A failed
        if: steps.phase.outputs.code != '0'
        run: exit 1
