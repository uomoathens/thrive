name: crops-check

on:
  workflow_dispatch:
  workflow_run:
    workflows: [crops-heat]
    types: [completed]
  push:
    branches: [main]
    paths:
      - config/crops-check.toml
      - config/crops-check-plan.md
      - src/thrive/data/crops_check.py
      - .github/workflows/crops-check.yml

permissions:
  contents: write

concurrency:
  group: crops-check
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[crops]"
      - name: Run the crops checks
        id: phase
        run: |
          mkdir -p results/crops-check
          set +e
          timeout --signal=INT --kill-after=2m 20m thrive crops-check --config config/crops-check.toml --out results/crops-check > results/crops-check/last-run.log 2>&1
          code=$?
          set -e
          cat results/crops-check/last-run.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit results and the run log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/out"
          cp -r results/crops-check "$RUNNER_TEMP/out"
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin main
            git reset --hard origin/main
            rm -rf results/crops-check
            mkdir -p results
            cp -r "$RUNNER_TEMP/out" results/crops-check
            git add -A results/crops-check
            if git diff --cached --quiet; then
              echo "No change in results"
              exit 0
            fi
            git commit --allow-empty-message -m ""
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "Could not push the results after 5 attempts"
          exit 1
      - name: Fail if the study failed
        if: steps.phase.outputs.code != '0'
        run: exit 1
