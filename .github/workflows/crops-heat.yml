name: crops-heat

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 15 10 *"
  push:
    branches: [main]
    paths:
      - config/crops-heat.toml
      - src/thrive/data/crops_heat.py
      - .github/workflows/crops-heat.yml

permissions:
  contents: write

concurrency:
  group: crops-heat
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[sat]"
      - name: Run the crops heat study
        id: phase
        run: |
          mkdir -p results/crops-heat
          set +e
          timeout --signal=INT --kill-after=2m 310m thrive crops-heat --config config/crops-heat.toml --out results/crops-heat > results/crops-heat/last-run.log 2>&1
          code=$?
          set -e
          cat results/crops-heat/last-run.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit results and the run log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/out"
          cp -r results/crops-heat "$RUNNER_TEMP/out"
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin main
            git reset --hard origin/main
            rm -rf results/crops-heat
            mkdir -p results
            cp -r "$RUNNER_TEMP/out" results/crops-heat
            git add -A results/crops-heat
            if git diff --cached --quiet; then
              echo "No change in results"
              exit 0
            fi
            git commit --allow-empty-message -m ""
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "Could not push the results after 5 attempts"
          exit 1
      - name: Fail if the study failed
        if: steps.phase.outputs.code != '0'
        run: exit 1
