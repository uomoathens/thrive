<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ti de"><title id="ti">Which levee gets built?</title><desc id="de">Counted in property value, A saves 10.5 and B 9.0 million dollars. With equity weights at eta 1, A saves 6.5 and B 13.0 million.</desc><style>.t{font:650 19px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#f0efec;letter-spacing:-0.2px}.s{font:13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#c3c2b7}.a{font:12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#c3c2b7}.v{font:600 12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#f0efec}.g{stroke:#2b2b28;stroke-width:1}.k{stroke:#7a7970;stroke-width:1}.c1{fill:#3987e5}.c2{fill:#d95926}.l1{stroke:#3987e5;stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}.l2{stroke:#d95926;stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}.ring{stroke:#1a1a19;stroke-width:2}</style><rect x="0.5" y="0.5" width="719" height="439" rx="16" fill="#1a1a19" stroke="#33332f"/><text class="t" x="72" y="34">Which levee gets built?</text><text class="s" x="72" y="54">Benefits of two levees that cost the same</text><line class="g" x1="72" x2="688" y1="328.0" y2="328.0"/><text class="a" x="64" y="332.0" text-anchor="end">$0m</text><line class="g" x1="72" x2="688" y1="293.1" y2="293.1"/><text class="a" x="64" y="297.1" text-anchor="end">$2m</text><line class="g" x1="72" x2="688" y1="258.3" y2="258.3"/><text class="a" x="64" y="262.3" text-anchor="end">$4m</text><line class="g" x1="72" x2="688" y1="223.4" y2="223.4"/><text class="a" x="64" y="227.4" text-anchor="end">$6m</text><line class="g" x1="72" x2="688" y1="188.6" y2="188.6"/><text class="a" x="64" y="192.6" text-anchor="end">$8m</text><line class="g" x1="72" x2="688" y1="153.7" y2="153.7"/><text class="a" x="64" y="157.7" text-anchor="end">$10m</text><line class="g" x1="72" x2="688" y1="118.9" y2="118.9"/><text class="a" x="64" y="122.9" text-anchor="end">$12m</text><line class="g" x1="72" x2="688" y1="84.0" y2="84.0"/><text class="a" x="64" y="88.0" text-anchor="end">$14m</text><path class="c1" d="M180.0,328.0 V149.0 Q180.0,145.0 184.0,145.0 H200.0 Q204.0,145.0 204.0,149.0 V328.0 Z"/><text class="v" x="192.0" y="137.0" text-anchor="middle">A: $10.5m</text><path class="c2" d="M248.0,328.0 V175.1 Q248.0,171.1 252.0,171.1 H268.0 Q272.0,171.1 272.0,175.1 V328.0 Z"/><text class="v" x="260.0" y="163.1" text-anchor="middle">B: $9.0m</text><text class="a" x="226.0" y="348.0" text-anchor="middle">Counted in property value</text><path class="c1" d="M488.0,328.0 V218.7 Q488.0,214.7 492.0,214.7 H508.0 Q512.0,214.7 512.0,218.7 V328.0 Z"/><text class="v" x="500.0" y="206.7" text-anchor="middle">A: $6.5m</text><path class="c2" d="M556.0,328.0 V105.4 Q556.0,101.4 560.0,101.4 H576.0 Q580.0,101.4 580.0,105.4 V328.0 Z"/><text class="v" x="568.0" y="93.4" text-anchor="middle">B: $13.0m</text><text class="a" x="534.0" y="348.0" text-anchor="middle">Counted with equity weights (η = 1)</text><line class="k" x1="72" x2="688" y1="153.7" y2="153.7"/><text class="a" x="380.0" y="147.7" text-anchor="middle">cost of each levee: $10m</text><line class="k" x1="72" x2="688" y1="328" y2="328"/><rect class="c1" x="72" y="371" width="10" height="10" rx="2"/><text class="a" x="88" y="380">A: 50 homes worth $210,000</text><rect class="c2" x="302" y="371" width="10" height="10" rx="2"/><text class="a" x="318" y="380">B: 100 homes worth $90,000</text><text class="a" x="72" y="406">Example from Z. Liscow (Yale), NBER 2023. The weighted bars assume household income follows</text><text class="a" x="72" y="423">home value. This is an illustration, not a THRIVE result.</text></svg>