<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="ti de"><title id="ti">Which levee gets built?</title><desc id="de">Counted in property value, A saves 10.5 and B 9.0 million dollars. With equity weights at eta 1, A saves 6.5 and B 13.0 million.</desc><style>
