" x1="72" x2="696" y1="141.4" y2="141.4"/><text class="a" x="384.0" y="135.4" text-anchor="middle">cost of each levee: $10m</text><line class="k" x1="72" x2="696" y1="320" y2="320"/><rect class="c1" x="72" y="369" width="10" height="10" rx="2"/><text class="a" x="88" y="378">A: 50 homes worth $210,000</text><rect class="c2" x="302" y="369" width="10" height="10" rx="2"/><text class="a" x="318" y="378">B: 100 homes worth $90,000</text><text class="a" x="72" y="404">Example from Z. Liscow (Yale), NBER 2023. The weighted bars assume household income follows</text><text class="a" x="72" y="420">home value. This is an illustration, not a THRIVE result.</text></svg>