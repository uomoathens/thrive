[cems]
activation = "EMSR692"
detail = "https://rapidmapping.emergency.copernicus.eu/backend/dashboard-api/public-activations/?code={code}"
product_types = ["DEL", "GRA"]
flood_layer_words = ["observedevent"]
check_layer_words = ["maximumwaterextent"]
class_columns = ["notation", "obj_desc"]

[grid]
name = "Eurostat census grid 2021, version 2.2 (22 January 2025)"
url = "https://gisco-services.ec.europa.eu/census/2021/Eurostat_Census-GRID_2021_V2.2.zip"
population = ["T", "TOT_P_2021", "TOT_P"]
older = ["Y_GE65"]
older_required = true
cell_size_m = 1000

[regions]
url = "https://gisco-services.ec.europa.eu/distribution/v2/nuts/geojson/NUTS_RG_01M_2021_4326_LEVL_3.geojson"
prefix = "EL61"

[analysis]
crs = 3035
min_exposed_for_ratio = 1000

[[extent]]
key = "observed_all"
name = "Observed flood, including flood traces"
source = "observed"
exclude = []

[[extent]]
key = "observed_water"
name = "Observed standing water, without flood traces"
source = "observed"
exclude = ["Flood trace"]

[[extent]]
key = "cems_maximum"
name = "Copernicus maximum water extent"
source = "maximum"

[validation]
source = "ELSTAT, Census 2021, permanent population by regional unit (EL611 = Karditsa 106,305 + Trikala 122,081; EL612 = Larisa 268,963; EL613 = Magnesia 177,448 + Sporades 13,458)"

[validation.population]
EL611 = 228386
EL612 = 268963
EL613 = 190906
