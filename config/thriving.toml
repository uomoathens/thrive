[stac]
url = "https://earth-search.aws.element84.com/v1"
collection = "sentinel-2-c1-l2a"
max_cloud = 80
min_items_per_year = 600
max_failed_share = 0.1
workers = 4

[stac.assets]
red = "red"
nir = "nir"
scl = "scl"

[periods]
flood_date = "2023-09-07"
baseline = ["2019-01-01", "2021-12-31"]
after = ["2023-09-11", "2024-12-31"]

[pixels]
resolution_m = 40
valid_classes = [4, 5, 6]
guard_classes = [4, 5]
min_valid_share = 0.7
min_cell_in_scene = 0.9
default_scale = 0.0001
default_offset = -0.1
max_negative_share = 0.05

[cells]
path = "results/phase-b/cells.gpkg"
layer = "cells"

[groups]
flooded_share_min = 0.5
min_cells = 20
min_residents = 50
control_ring_m = [3000, 15000]
control_rings = [[3000, 15000], [5000, 20000], [10000, 30000]]

[recovery]
alphas = [0.80, 0.85, 0.90, 0.95]
persistence = 3
max_gap = 3
min_coverage = 0.3
baseline_window = 1
min_baseline_ndvi = 0.3
min_cell_ndvi = 0.15
recovery_start = "2024-03-01"

[uncertainty]
replicates = 1000
seed = 20230907

[seasons]
min_periods = 5
tolerance = 0.03
compare = ["Spring 2024", "Summer 2024"]

[[seasons.list]]
name = "Autumn 2023"
start = "2023-09-11"
end = "2023-11-30"

[[seasons.list]]
name = "Spring 2024"
start = "2024-03-01"
end = "2024-05-31"

[[seasons.list]]
name = "Summer 2024"
start = "2024-06-01"
end = "2024-08-31"

[[comparisons]]
a = "Flooded, Larisa"
b = "Flooded, Karditsa, Trikala"

[[comparisons]]
a = "Flooded, more older residents"
b = "Flooded, fewer older residents"

[[definitions]]
key = "observed_all"
name = "Observed flood, including flood traces"

[[definitions]]
key = "observed_water"
name = "Observed standing water, without flood traces"

[[definitions]]
key = "cems_maximum"
name = "Copernicus maximum water extent"
