[stac]
url = "https://earth-search.aws.element84.com/v1"
collection = "sentinel-2-c1-l2a"
max_cloud = 80
min_items = 40
max_failed_share = 0.1
workers = 4

[stac.assets]
red = "red"
nir = "nir"
scl = "scl"

[periods]
flood_date = "2023-09-07"
baseline = ["2021-01-01", "2022-12-31"]
after = ["2023-09-11", "2024-12-31"]

[pixels]
resolution_m = 40
valid_classes = [4, 5, 6]
guard_classes = [4, 5]
min_valid_share = 0.7
min_cell_in_scene = 0.9
default_scale = 0.0001
default_offset = -0.1
max_negative_share = 0.05

[cells]
path = "results/phase-b/cells.gpkg"
layer = "cells"

[groups]
flooded_share_min = 0.5
min_cells = 20
min_residents = 50
control_ring_m = [3000, 15000]

[recovery]
alphas = [0.80, 0.85, 0.90, 0.95]
persistence = 3
max_gap = 3
min_coverage = 0.3
baseline_window = 1

[[definitions]]
key = "observed_all"
name = "Observed flood, including flood traces"

[[definitions]]
key = "observed_water"
name = "Observed standing water, without flood traces"

[[definitions]]
key = "cems_maximum"
name = "Copernicus maximum water extent"
